<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Studioodle · Brush overlay study 01</title>
  <link rel="stylesheet" href="study.css">
</head>
<body>
  <header class="review">
    <div><strong>Brush / study 01</strong><span>Choose a tool. Shape the tip. Try a stroke.</span></div>
    <button id="theme" type="button">Light / dark</button>
  </header>
  <main class="stage">
    <section class="panel" role="dialog" aria-modal="false" aria-labelledby="brush-title">
      <h1 id="brush-title" class="sr-only">Choose your brush</h1>
      <header class="panel-top">
        <div class="tools" role="group" aria-label="Brush type"></div>
        <button class="icon close" aria-label="Close brush options" title="Close brush options" type="button"></button>
      </header>
      <div class="paper">
        <canvas id="preview" aria-label="Try your brush here. Changing a setting redraws the sample stroke."></canvas>
        <button class="icon clear" type="button" aria-label="Clear the practice paper" title="Clear practice paper"></button>
        <span class="paper-fold" aria-hidden="true"></span>
        <span class="practice-hint" aria-hidden="true"></span>
      </div>
      <div class="tip-row">
        <div class="tips" role="group" aria-label="Tip shape"></div>
      </div>
      <footer class="footer">
        <div class="size-control" role="group" aria-label="Brush size">
          <button class="icon smaller" type="button" aria-label="Make brush one unit smaller" title="Smaller by 1"></button>
          <div class="slider-wrap"><input id="size" type="range" min="1" max="64" step="1" value="12" aria-label="Brush size in page units"></div>
          <input id="size-number" type="number" min="1" max="64" step="1" value="12" aria-label="Exact brush size in page units" title="Exact brush size · 1–64">
          <button class="icon larger" type="button" aria-label="Make brush one unit larger" title="Larger by 1"></button>
        </div>
        <button class="apply" type="button" aria-label="Use this brush" title="Use this brush"></button>
      </footer>
    </section>
  </main>
  <p class="review-note">Interactive design proposal. Icons have tooltips and accessible names. Oval and chisel are proposed tips. The app is unchanged.</p>
  <div class="notice" role="status" aria-live="polite"></div>
  <script src="study.js"></script>
</body>
</html>
