<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Blank paper overlay study</title><style>
*{box-sizing:border-box}body{margin:0;color:#f6f0e2;background:#111f34;font:600 15px 'Segoe UI',sans-serif;--panel:linear-gradient(145deg,#293b56,#1c2b43);--ink:#f6f0e2;--well:#ffffff0b;--border:#64738d;--gold:#ddc799;--goldink:#243148;--scene:url('../../src/assets/backgrounds/selection-night.webp')}body.light{background:#eadcc1;color:#35545c;--panel:linear-gradient(145deg,#fcf7eb,#eee5d0);--ink:#35545c;--well:#35545c0e;--border:#a7bdbd;--gold:#3e747d;--goldink:#fffaf0;--scene:url('../../src/assets/backgrounds/selection-beach.webp')}button{font:inherit;color:inherit;cursor:pointer}button:focus-visible{outline:3px solid var(--gold);outline-offset:3px}svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;display:block}.review{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:18px 24px}.review h1{font-size:17px;margin:0 auto 0 0}.review button{padding:8px 13px;border:1px solid var(--border);border-radius:12px;background:var(--well)}.stage{height:calc(100svh - 82px);min-height:430px;background:linear-gradient(#0b142c66,#0b142c88),var(--scene) center/cover;display:grid;place-items:center;padding:18px}.panel{width:min(900px,100%);height:min(580px,100%);min-height:0;border:2px solid var(--border);border-radius:30px;background:var(--panel);box-shadow:0 20px 60px #0005;padding:22px;display:flex;flex-direction:column;gap:18px}.top{position:relative;display:flex;justify-content:center;align-items:center;min-height:52px;flex-shrink:0}.icon{display:flex;align-items:center;justify-content:center;width:46px;height:46px;padding:8px;border:0;border-radius:14px;background:transparent}.round{border-radius:50%;background:var(--well)}.close{position:absolute;right:0;top:3px}.back{position:absolute;left:0;top:3px}.steps{display:flex;align-items:center;gap:12px;padding:4px;background:var(--well);border-radius:18px}.steps .active{background:var(--gold);color:var(--goldink)}.step-link{width:24px;height:1px;background:var(--border);opacity:.65}.content{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px}.sizes{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;width:100%;max-width:790px;align-items:stretch}.size{display:flex;align-items:center;justify-content:center;min-width:0;height:230px;border:1px solid transparent;border-radius:22px;background:var(--well);padding:14px}.size.active{background:#ddc79912;border:2px solid var(--gold)}.size svg{flex:none;width:var(--w);height:var(--h);max-width:100%;filter:drop-shadow(0 4px 5px #0002)}.paper-face{fill:#f6f0e2;stroke:none}.size.active .paper-face{fill:#ddc799}.fold{fill:#24314812;stroke:#24314855;stroke-width:1}.paper-type{font-family:'Segoe UI',sans-serif;font-weight:900;fill:#243148;stroke:none;letter-spacing:-1px}.paper-unit{font-size:10px;font-weight:600;letter-spacing:0}.orientations{display:flex;gap:6px;padding:4px;border-radius:18px;background:var(--well)}.orientations .icon{width:58px;height:46px}.orientations .active{background:var(--gold);color:var(--goldink)}.orientations button:disabled{opacity:.35;cursor:default}.footer{position:relative;flex-shrink:0;min-height:50px;display:flex;align-items:center;justify-content:flex-end}.next,.draw{height:50px;border:0;border-radius:17px;background:var(--gold);color:var(--goldink);display:flex;align-items:center;justify-content:center}.next{width:94px}.next svg{width:32px;height:32px}.draw{width:142px;padding:0}.magic{width:118px;height:44px;background:var(--goldink);mask:url('assets/magic-pencil-v4-cropped.png') center/contain no-repeat}.palette{display:grid;grid-template-columns:repeat(8,60px);gap:16px;justify-content:center}.swatch{position:relative;width:60px;height:60px;border:2px solid #ffffff55;border-radius:50%;padding:0;display:grid;place-items:center;background:var(--color)}.swatch.active{outline:3px solid var(--gold);outline-offset:4px}.swatch .tick{width:25px;height:25px;border-radius:50%;display:grid;place-items:center;background:var(--tickbg);color:var(--tickink)}.tick svg{width:17px;height:17px;stroke-width:2.5}.paper-summary{position:absolute;left:0;display:flex;align-items:center;justify-content:center;width:78px;height:50px}.paper-summary svg{width:70px;height:48px;filter:drop-shadow(0 2px 3px #0003)}[hidden]{display:none!important}.preview .review{display:none}.preview .stage{height:100svh;min-height:0;padding:12px}.preview .panel{height:min(680px,100%)}.notice{position:fixed;bottom:8px;left:50%;transform:translateX(-50%);padding:10px 16px;border-radius:10px;background:var(--gold);color:var(--goldink);font-size:13px;z-index:3}.notice:empty{display:none}

</style><header class="review"><h1>Blank paper / layout study</h1><button id="show-size">Paper step</button><button id="show-color">Color step</button><button id="theme">Light / Dark</button></header><main class="stage"><section class="panel" aria-label="Blank paper setup study"><header class="top"><button class="icon round back" aria-label="Back to paper" title="Back to paper"></button><div class="steps" role="group" aria-label="Setup steps"><button class="icon step-paper" aria-label="Paper size and orientation" title="Paper size and orientation"></button><span class="step-link"></span><button class="icon step-color" aria-label="Paper color" title="Paper color"></button></div><button class="icon round close" aria-label="Close setup" title="Close setup"></button></header><div class="content"><div class="sizes" role="group" aria-label="Paper size"></div><div class="orientations" role="group" aria-label="Orientation"></div><div class="palette" role="group" aria-label="Paper color"></div></div><footer class="footer"><div class="paper-summary" aria-hidden="true"></div><button class="next" aria-label="Next: paper color" title="Next: paper color"></button><button class="draw" aria-label="Start drawing" title="Start drawing"><span class="magic" aria-hidden="true"></span></button></footer></section></main><div class="notice" role="status"></div>
<script>
if(new URLSearchParams(location.search).has('preview'))document.body.classList.add('preview');
const colors=[{"name": "Dark charcoal", "hex": "#242428"}, {"name": "Slate gray", "hex": "#6c717b"}, {"name": "Cool silver", "hex": "#b0b5bc"}, {"name": "Icy blue-white", "hex": "#cce8ff"}, {"name": "Warm cream", "hex": "#f6f2e8"}, {"name": "Soft peach", "hex": "#f1c49c"}, {"name": "Golden tan", "hex": "#d79862"}, {"name": "Dark cocoa", "hex": "#2b1810"}, {"name": "Warm saddle", "hex": "#9e5e38"}, {"name": "Deep espresso", "hex": "#563222"}, {"name": "Deep burgundy", "hex": "#8c1d2a"}, {"name": "Retro red", "hex": "#d93b3b"}, {"name": "Warm orange", "hex": "#e86a33"}, {"name": "Golden amber", "hex": "#ee9b33"}, {"name": "Sunny yellow", "hex": "#fad02c"}, {"name": "Butter yellow", "hex": "#fdf08a"}, {"name": "Baby pink", "hex": "#f28da8"}, {"name": "Soft coral", "hex": "#e66782"}, {"name": "Deep magenta", "hex": "#a33878"}, {"name": "Pastel lavender", "hex": "#a888db"}, {"name": "Vibrant purple", "hex": "#7c43b2"}, {"name": "Deep plum", "hex": "#4d2163"}, {"name": "Deep blue-violet", "hex": "#43318f"}, {"name": "Midnight indigo", "hex": "#1e2756"}, {"name": "Lime", "hex": "#a4df55"}, {"name": "Leaf green", "hex": "#68a832"}, {"name": "Forest green", "hex": "#2d783b"}, {"name": "Deep moss", "hex": "#1b4b38"}, {"name": "Retro teal", "hex": "#38b29c"}, {"name": "Sky blue", "hex": "#82cafa"}, {"name": "Classic blue", "hex": "#4892dc"}, {"name": "Royal blue", "hex": "#254e9b"}];
const icon=path=>'<svg viewBox="0 0 24 24" aria-hidden="true">'+path+'</svg>';
const shapes={paper:'<path d="M7 3h13v16H7ZM4 6H2v16h13v-2"/>',palette:'<path d="M12 3a9 9 0 1 0 0 18h1a2 2 0 0 0 1-4c-2-1-1-3 1-3h2a4 4 0 0 0 4-4c0-4-4-7-9-7Z"/><circle cx="7" cy="10" r=".7"/><circle cx="11" cy="7" r=".7"/><circle cx="16" cy="8" r=".7"/>',back:'<path d="m14 5-7 7 7 7M7 12h14"/>',next:'<path d="m10 5 7 7-7 7M3 12h14"/>',close:'<path d="m6 6 12 12M6 18 18 6"/>',check:'<path d="m5 12 4 4L19 6"/>'};
const presets=[{id:'full',label:'A4',w:210,h:297,font:32},{id:'half',label:'A5',w:148,h:210,font:25},{id:'photo',label:'4 x 6',w:101.6,h:152.4,font:16,unit:'in'},{id:'square',label:'6 x 6',w:152.4,h:152.4,font:19,unit:'in'}];
let step=0,preset='full',orientation='landscape',color='#f6f2e8';
function paper(p,w,h,fill){const fold=Math.min(12,w*.12);return '<svg viewBox="0 0 '+w+' '+h+'" aria-hidden="true"><path class="paper-face" style="'+(fill?'fill:'+fill:'')+'" d="M1 1H'+(w-fold)+'L'+(w-1)+' '+fold+'V'+(h-1)+'H1Z"/><path class="fold" d="M'+(w-fold)+' 1V'+fold+'H'+(w-1)+'Z"/><text class="paper-type" x="'+(w/2)+'" y="'+(h/2+(p.unit?-3:2))+'" dominant-baseline="middle" text-anchor="middle" font-size="'+p.font+'">'+p.label+'</text>'+(p.unit?'<text class="paper-type paper-unit" x="'+w/2+'" y="'+(h/2+16)+'" text-anchor="middle">in</text>':'')+'</svg>'}
function render(){document.querySelector('.step-paper').classList.toggle('active',step===0);document.querySelector('.step-color').classList.toggle('active',step===1);document.querySelector('.back').hidden=step===0;document.querySelector('.sizes').hidden=step!==0;document.querySelector('.orientations').hidden=step!==0;document.querySelector('.palette').hidden=step!==1;document.querySelector('.next').hidden=step!==0;document.querySelector('.draw').hidden=step!==1;document.querySelector('.paper-summary').hidden=step!==1;
const sizes=document.querySelector('.sizes');sizes.replaceChildren();presets.forEach(p=>{const wide=orientation==='landscape'&&p.id!=='square',w=(wide?p.h:p.w)*.5,h=(wide?p.w:p.h)*.5;const b=document.createElement('button');b.className='size'+(preset===p.id?' active':'');b.setAttribute('aria-label',p.label+(p.unit?' inches':''));b.setAttribute('aria-pressed',preset===p.id);b.style.setProperty('--w',w+'px');b.style.setProperty('--h',h+'px');b.innerHTML=paper(p,w,h);b.onclick=()=>{preset=p.id;render()};sizes.append(b)});
const orientations=document.querySelector('.orientations');orientations.replaceChildren();['portrait','landscape'].forEach(o=>{const b=document.createElement('button');b.className='icon'+(orientation===o&&preset!=='square'?' active':'');b.title=o==='portrait'?'Tall':'Wide';b.setAttribute('aria-label',b.title);b.disabled=preset==='square';b.innerHTML=icon(o==='portrait'?'<rect x="6" y="2" width="12" height="20" rx="1"/>':'<rect x="2" y="6" width="20" height="12" rx="1"/>');b.onclick=()=>{orientation=o;render()};orientations.append(b)});
const palette=document.querySelector('.palette');palette.replaceChildren();colors.forEach(c=>{const b=document.createElement('button');b.className='swatch'+(c.hex===color?' active':'');b.style.setProperty('--color',c.hex);b.title=c.name;b.setAttribute('aria-label',c.name);b.setAttribute('aria-pressed',c.hex===color);if(c.hex===color){b.innerHTML='<span class="tick">'+icon(shapes.check)+'</span>';b.style.setProperty('--tickbg','#243148');b.style.setProperty('--tickink','#fffaf0')}b.onclick=()=>{color=c.hex;render()};palette.append(b)});
const p=presets.find(p=>p.id===preset);const w=p.id==='square'?44:orientation==='landscape'?70:44,h=p.id==='square'?44:orientation==='landscape'?49:62;document.querySelector('.paper-summary').innerHTML=paper({...p,font:18},w,h,color)}
document.querySelector('.step-paper').innerHTML=icon(shapes.paper);document.querySelector('.step-color').innerHTML=icon(shapes.palette);document.querySelector('.back').innerHTML=icon(shapes.back);document.querySelector('.next').innerHTML=icon(shapes.next);document.querySelector('.close').innerHTML=icon(shapes.close);
document.querySelector('.step-paper').onclick=document.querySelector('#show-size').onclick=document.querySelector('.back').onclick=()=>{step=0;render()};document.querySelector('.step-color').onclick=document.querySelector('#show-color').onclick=document.querySelector('.next').onclick=()=>{step=1;render()};document.querySelector('#theme').onclick=()=>document.body.classList.toggle('light');document.querySelector('.draw').onclick=()=>{document.querySelector('.notice').textContent='Would open a '+presets.find(p=>p.id===preset).label+' '+orientation+' drawing with the selected paper color.'};document.querySelector('.close').onclick=()=>{document.querySelector('.notice').textContent='Mockup only: close the setup overlay.'};window.blankStudy={step:n=>{step=n;render()},orientation:o=>{orientation=o;render()}};render();
</script></html>
