<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Studioodle / Overlay layout studies</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#111f34;color:#f6f0e2;font:600 15px "Segoe UI",sans-serif;--panel:linear-gradient(145deg,#293b56,#1c2b43);--ink:#f6f0e2;--line:#64738d;--well:#ffffff0b;--gold:#ddc799;--goldink:#243148;--bg:url('../../src/assets/backgrounds/selection-night.webp')}body.light{background:#eadcc1;color:#35545c;--panel:linear-gradient(145deg,#fcf7eb,#eee5d0);--ink:#35545c;--line:#a7bdbd;--well:#35545c0e;--gold:#3e747d;--goldink:#fffaf0;--bg:url('../../src/assets/backgrounds/selection-beach.webp')}button{font:inherit;cursor:pointer;color:inherit}button:focus-visible{outline:3px solid var(--gold);outline-offset:3px}button svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}.review{padding:20px 28px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}.review h1{font-size:17px;margin:0 auto 0 0}.review button{background:var(--well);border:1px solid var(--line);border-radius:12px;padding:8px 14px}.review button[aria-pressed=true]{background:var(--gold);color:var(--goldink);border-color:transparent}.note{margin:0;padding:0 28px 16px;font-size:13px;opacity:.8;max-width:950px;line-height:1.6}.stage{height:calc(100vh - 142px);min-height:530px;display:grid;place-items:center;padding:24px;background:linear-gradient(#0b142c66,#0b142c88),var(--bg) center/cover}.panel{width:min(900px,100%);height:min(580px,100%);min-height:430px;background:var(--panel);border:2px solid var(--line);border-radius:30px;box-shadow:0 20px 60px #0005;display:flex;flex-direction:column;padding:20px;gap:15px;position:relative}.top{display:flex;gap:10px;align-items:center}.group{display:flex;gap:6px;padding:5px;background:var(--well);border-radius:18px}.icon{display:grid;place-items:center;width:46px;height:46px;border:0;border-radius:14px;background:transparent;padding:9px}.icon:hover{background:var(--well)}.icon.active{background:var(--gold);color:var(--goldink)}.icon.round{border-radius:50%;background:var(--well)}.spacer{flex:1}.rule{width:1px;height:32px;background:var(--line);opacity:.5;margin:0 5px}.content{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;gap:18px}.paper{position:relative;display:flex;align-items:center;justify-content:center;min-width:0;flex:1;height:100%}.paper>button{background:transparent;border:0;padding:0;width:100%;height:100%;display:flex;align-items:center;justify-content:center}.paper img{max-width:100%;max-height:100%;object-fit:contain;background:#fff;border:3px solid #8797af;border-radius:13px;box-shadow:0 8px 24px #0002}.heart.active{color:#df8793;background:var(--well)}.heart.active svg{fill:currentColor}.footer{display:flex;align-items:center;gap:8px;min-height:56px}.start{background:var(--gold);color:var(--goldink);width:78px;height:54px;border-radius:18px}.start svg{width:31px;height:31px}.position{display:flex;gap:5px;align-items:center;justify-content:center}.position i{width:5px;height:5px;background:var(--line);border-radius:50%}.position i.current{width:18px;background:var(--gold);border-radius:5px}.detail svg{width:29px;height:29px}.content>.rail{display:none}.strip{display:none;gap:8px;justify-content:center}.mini{padding:3px;background:transparent;border:2px solid transparent;border-radius:10px;height:64px;width:86px}.mini img{width:100%;height:100%;object-fit:contain;background:#fff;border-radius:5px}.mini.current{border-color:var(--gold)}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;width:100%;height:100%;overflow:auto;padding:4px}.tile{position:relative;min-height:0;display:flex;align-items:center}.tile .open{width:100%;height:100%;padding:0;border:0;background:transparent}.tile img{width:100%;max-height:100%;object-fit:contain;border:2px solid #8797af;border-radius:10px;background:#fff}.tile .heart{position:absolute;right:6px;bottom:9px;background:var(--panel);width:36px;height:36px;padding:7px;border:1px solid var(--line);border-radius:50%}.tile .heart svg{width:20px;height:20px}.panel[data-layout=rail] .rail{display:flex;flex-direction:column;gap:8px;padding:5px;background:var(--well);border-radius:18px}.panel[data-layout=rail] .footer .utilities{display:none}.panel[data-layout=rail] .content{gap:12px}.panel[data-layout=strip] .strip{display:flex}.panel[data-layout=strip] .footer{min-height:46px}.panel[data-grid=true] .content>.icon,.panel[data-grid=true] .strip{display:none}.utilities{display:flex;gap:6px}.status{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);padding:10px 20px;border-radius:12px;background:var(--gold);color:var(--goldink);z-index:3;box-shadow:0 4px 20px #0003}.status:empty{display:none}[hidden]{display:none!important}
@media(max-width:600px){.review{padding:14px;gap:6px}.review h1{width:100%;font-size:15px}.review button{padding:7px 10px;font-size:12px}.note{padding:0 14px 12px;font-size:12px}.stage{height:calc(100svh - 190px);min-height:480px;padding:14px}.panel{padding:12px;gap:12px;border-radius:24px;min-height:430px}.top{gap:6px;flex-wrap:wrap}.top .group:first-child{margin-right:auto}.top .detail-group{order:2}.top .filter-heart{order:2}.icon{width:42px;height:42px;padding:8px}.group{gap:2px;padding:3px}.content{gap:5px}.content>.icon{width:32px;min-width:32px;padding:5px}.paper img{border-width:2px}.footer{gap:3px;flex-wrap:wrap}.footer .icon{width:40px;height:44px}.footer .start{width:58px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.panel[data-layout=rail] .rail{padding:0;gap:8px}.panel[data-layout=rail] .content>.icon{display:none}.mini{width:44px;height:38px;padding:2px;border-radius:7px}.strip{gap:3px}.panel[data-layout=strip] .content{min-height:170px}}
@media(max-height:650px) and (min-width:601px){.stage{min-height:370px;padding:14px}.panel{min-height:340px;padding:12px;gap:8px}.icon{height:40px;width:40px}.footer{min-height:42px}.mini{height:42px;width:64px}}
.paper .sheet{position:relative;max-width:100%;max-height:100%;display:flex;align-items:center;justify-content:center;aspect-ratio:1123/794;height:100%}.sheet>button:first-child{display:block;width:100%;height:100%;border:0;padding:0;background:transparent}.sheet img{display:block;width:100%;height:100%;object-fit:contain}.page-number{position:absolute;bottom:12px;left:12px;background:#ddc799;color:#243148;padding:7px 13px;border-radius:11px;font-size:15px;font-weight:700;box-shadow:0 2px 7px #0002;pointer-events:none;font-variant-numeric:tabular-nums}.paper .page-heart{position:absolute;right:12px;bottom:12px;width:44px;height:44px;border-radius:50%;background:#fff8f1ed;color:#c94f66;box-shadow:0 2px 7px #0002;border:1px solid #c94f6640}.page-heart:not(.active) svg{stroke-dasharray:1.2 3;stroke-linecap:round;stroke-width:2}.page-heart.active{color:#cf4b64;background:#fff8f1}.page-heart.active svg{fill:currentColor}.panel .footer>.spacer:nth-of-type(2){display:none}
</style>
<header class="review"><h1>Coloring Pages / layout studies</h1><button data-concept="classic" aria-pressed="true">A / Focus</button><button data-concept="rail" aria-pressed="false">B / Side tools</button><button data-concept="strip" aria-pressed="false">C / Filmstrip</button><button id="theme">Light / Dark</button></header>
<p class="note" id="description"></p>
<main class="stage"><section class="panel" data-layout="classic" data-grid="false" aria-label="Coloring pages layout concept">
<div class="top"><div class="group categories" aria-label="Example category filters"></div><div class="group detail-group" aria-label="Detail filters"></div><button class="icon round filter-heart" data-icon="heart" aria-label="Favorites only" title="Favorites only"></button><button class="icon round view" data-icon="grid" aria-label="Switch to grid" title="Switch between single and grid"></button><span class="spacer"></span><button class="icon round" data-icon="close" aria-label="Close" title="Close" data-demo="Close the coloring-page overlay"></button></div>
<div class="content"><button class="icon round previous" data-icon="left" aria-label="Previous page" title="Previous page"></button><div class="paper"></div><button class="icon round next" data-icon="right" aria-label="Next page" title="Next page"></button><aside class="rail utilities"></aside></div>
<div class="strip" aria-label="Jump to page"></div>
<footer class="footer"><div class="utilities"></div><span class="spacer"></span><div class="position" aria-label="Browsing position"></div><span class="spacer"></span><button class="icon start" data-icon="draw" aria-label="Start coloring" title="Start coloring"></button></footer>
</section></main><div class="status" role="status"></div>
<script>
const paths={close:'<path d="m6 6 12 12M6 18 18 6"/>',left:'<path d="m14 5-7 7 7 7M7 12h14"/>',right:'<path d="m10 5 7 7-7 7M3 12h14"/>',grid:'<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>',single:'<rect x="3" y="4" width="18" height="16" rx="2"/>',heart:'<path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 21l8.8-8.6a5.5 5.5 0 0 0 0-7.8Z"/>',add:'<path d="M14 2H5v20h14V7Z M14 2v5h5M8 14h8m-4-4v8"/>',share:'<path d="M14 2H5v20h14v-5M14 2v5h5M12 13l9-9m-6 0h6v6"/>',delete:'<path d="M3 6h18M9 6V3h6v3M5 6l1 15h12l1-15M10 10v7m4-7v7"/>',draw:'<path d="m4 18-1 4 4-1L20 8l-3-3ZM14 8l3 3M15 3l3-2 5 5-2 3"/>',all:'<circle cx="7" cy="7" r="3"/><rect x="14" y="4" width="6" height="6" rx="1"/><path d="m7 14 4 7H3Z"/><circle cx="17" cy="18" r="3"/>',tree:'<path d="m12 2-7 8h4l-6 7h7v5h4v-5h7l-6-7h4Z"/>',sun:'<circle cx="12" cy="12" r="4"/><path d="M12 1v2m0 18v2M1 12h2m18 0h2M4 4l2 2m12 12 2 2M4 20l2-2M18 6l2-2"/>',animal:'<path d="m5 9-2-6 7 3m9 3 2-6-7 3M5 9c-3 9 0 13 7 13s10-4 7-13Q12 3 5 9Z"/><circle cx="8" cy="12" r=".5"/><circle cx="16" cy="12" r=".5"/><path d="m10 16 2 2 2-2"/>',simple:'<circle cx="12" cy="12" r="8"/>',medium:'<circle cx="12" cy="12" r="8"/><path d="M4 12h16M12 4v16"/>',detailed:'<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="4"/><path d="M4 12h16M12 4v16M6 6l12 12M6 18 18 6"/>'};
const icon=name=>'<svg viewBox="0 0 24 24" aria-hidden="true">'+paths[name]+'</svg>';
const pages=[['winter','Christmas Skating Village','tree'],['beach','Beach','sun'],['spring','Spring','tree'],['counting','Counting','animal'],['garden','Garden','tree'],['safari','Safari','animal']];
let current=0,grid=false,favorites=new Set(['garden']),favoriteOnly=false,category='all',detail=0;
const panel=document.querySelector('.panel'),paper=document.querySelector('.paper'),status=document.querySelector('.status');
const tell=text=>{status.textContent=text;clearTimeout(window.notice);window.notice=setTimeout(()=>status.textContent='',2400)};
const visible=()=>pages.filter(p=>(category==='all'||p[2]===category)&&(!favoriteOnly||favorites.has(p[0])));
function action(name,label,handler){const b=document.createElement('button');b.className='icon';b.innerHTML=icon(name);b.title=label;b.setAttribute('aria-label',label);b.onclick=handler;return b}
for(const name of ['all','animal','tree','sun']){const b=action(name,name==='all'?'All subjects':name==='animal'?'Animals and characters':name==='tree'?'Nature and seasonal':'Outdoors',()=>{category=name;current=0;render()});b.dataset.category=name;document.querySelector('.categories').append(b)}
for(const [i,name] of ['simple','medium','detailed'].entries()){const b=action(name,['Simple detail','Medium detail','High detail'][i],()=>{detail=i;render();tell('Detail icons are a visual proposal; no difficulty classification is applied to these six pages.')});b.dataset.detail=i;document.querySelector('.detail-group').append(b)}
for(const group of document.querySelectorAll('.utilities')){group.append(action('add','Add page: paste code or upload file',()=>tell('Would open Add Page: paste a sharing code or choose a file.')),action('share','Share page: copy code or download',()=>tell('Would share '+visible()[current]?.[1]+': copy code or download.')),action('delete','Delete custom page',()=>tell('Custom-page control shown for layout review. Bundled pages cannot be deleted.')))}
function openPage(p){tell('Would open '+p[1]+' directly in the drawing canvas.')}
function render(){const list=visible();current=Math.min(current,Math.max(0,list.length-1));panel.dataset.grid=grid;document.querySelector('.view').innerHTML=icon(grid?'single':'grid');document.querySelector('.view').setAttribute('aria-label',grid?'Switch to single page':'Switch to grid');document.querySelector('.filter-heart').classList.toggle('active',favoriteOnly);document.querySelectorAll('[data-category]').forEach(b=>b.classList.toggle('active',b.dataset.category===category));document.querySelectorAll('[data-detail]').forEach(b=>b.classList.toggle('active',Number(b.dataset.detail)===detail));paper.replaceChildren();
if(!list.length){paper.innerHTML=icon('heart');tell('No example pages match. Turn off the heart filter or choose All.')}else if(grid){const g=document.createElement('div');g.className='grid';for(const p of list){const tile=document.createElement('div');tile.className='tile';const b=document.createElement('button');b.className='open';b.title=p[1];b.setAttribute('aria-label','Color '+p[1]);b.innerHTML='<img src="pages/'+p[0]+'.png" alt="'+p[1]+'">';b.onclick=()=>{current=list.indexOf(p);openPage(p)};const h=action('heart','Favorite '+p[1],()=>{favorites.has(p[0])?favorites.delete(p[0]):favorites.add(p[0]);render()});h.className='icon heart'+(favorites.has(p[0])?' active':'');tile.append(b,h);g.append(tile)}paper.append(g)}else{const p=list[current];const b=document.createElement('button');b.innerHTML='<img src="pages/'+p[0]+'.png" alt="'+p[1]+'">';b.title='Color '+p[1];b.onclick=()=>openPage(p);const sheet=document.createElement('div');sheet.className='sheet';sheet.append(b);const badge=document.createElement('span');badge.className='page-number';badge.textContent=(current+1)+' / '+list.length;badge.setAttribute('aria-label','Page '+(current+1)+' of '+list.length);const heart=action('heart','Favorite '+p[1],()=>{favorites.has(p[0])?favorites.delete(p[0]):favorites.add(p[0]);render()});heart.className='icon heart page-heart'+(favorites.has(p[0])?' active':'');heart.setAttribute('aria-pressed',favorites.has(p[0]));sheet.append(badge,heart);paper.append(sheet)}
const strip=document.querySelector('.strip');strip.replaceChildren();list.forEach((p,i)=>{const b=document.createElement('button');b.className='mini'+(i===current?' current':'');b.title='Browse '+p[1];b.innerHTML='<img src="pages/'+p[0]+'.png" alt="'+p[1]+'">';b.onclick=()=>{current=i;render()};strip.append(b)});document.querySelector('.position').hidden=true;document.querySelector('.start').hidden=grid||!list.length;document.querySelector('.start').onclick=()=>openPage(list[current]);document.querySelector('.start').title='Color '+(list[current]?.[1]||'page');document.querySelector('.start').setAttribute('aria-label',document.querySelector('.start').title)}
document.querySelectorAll('[data-icon]').forEach(b=>b.innerHTML=icon(b.dataset.icon));document.querySelectorAll('[data-demo]').forEach(b=>b.onclick=()=>tell(b.dataset.demo));document.querySelector('.previous').onclick=()=>{current=(current+visible().length-1)%visible().length;render()};document.querySelector('.next').onclick=()=>{current=(current+1)%visible().length;render()};document.querySelector('.view').onclick=()=>{grid=!grid;render()};document.querySelector('.filter-heart').onclick=()=>{favoriteOnly=!favoriteOnly;current=0;render()};
const descriptions={classic:'A / Focus / categories and detail above one large page; add/share below. The grid switch remembers your browsing position. All controls are visual proposals; no saves or imports occur.',rail:'B / Side tools / the same page-first browser, with add/share/custom-delete together beside the artwork. More room beneath the preview, but less artwork width on narrow screens.',strip:'C / Filmstrip / a large page with a small visual index beneath it. Jump between nearby pages without opening a grid. The extra thumbnails compete slightly with preview height.'};
function concept(name){panel.dataset.layout=name;document.querySelectorAll('[data-concept]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.concept===name));document.querySelector('#description').textContent=descriptions[name]}
document.querySelectorAll('[data-concept]').forEach(b=>b.onclick=()=>concept(b.dataset.concept));document.querySelector('#theme').onclick=()=>document.body.classList.toggle('light');window.study={concept,grid:()=>{grid=!grid;render()}};concept('classic');render();
</script></html>
