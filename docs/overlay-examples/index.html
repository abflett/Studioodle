function render(){const list=visible();current=Math.min(current,Math.max(0,list.length-1));panel.dataset.grid=grid;document.querySelector('.view').innerHTML=icon(grid?'single':'grid');document.querySelector('.view').setAttribute('aria-label',grid?'Switch to single page':'Switch to grid');document.querySelector('.filter-heart').classList.toggle('active',favoriteOnly);document.querySelectorAll('[data-category]').forEach(b=>b.classList.toggle('active',b.dataset.category===category));document.querySelectorAll('[data-detail]').forEach(b=>b.classList.toggle('active',Number(b.dataset.detail)===detail));paper.replaceChildren();
if(!list.length){paper.innerHTML=icon('heart');tell('No example pages match. Turn off the heart filter or choose All.')}else if(grid){const g=document.createElement('div');g.className='grid';for(const p of list.slice(Math.floor(current/6)*6,Math.floor(current/6)*6+6)){const tile=document.createElement('div');tile.className='tile';const b=document.createElement('button');b.className='open';b.title=p[1];b.setAttribute('aria-label','Color '+p[1]);b.innerHTML='<img src="pages/'+p[0]+'.png" alt="'+p[1]+'">';b.onclick=()=>{current=list.indexOf(p);grid=false;render()};const h=action('heart','Favorite '+p[1],()=>{favorites.has(p[0])?favorites.delete(p[0]):favorites.add(p[0]);render()});h.className='icon heart'+(favorites.has(p[0])?' active':'');const n=document.createElement('span');n.className='tile-number';n.textContent=(list.indexOf(p)+1)+' / '+list.length;const frame=document.createElement('div');frame.className='preview-frame';frame.append(b,h);tile.append(frame,n);g.append(tile)}paper.append(g)}else{const p=list[current];const b=document.createElement('button');b.innerHTML='<img src="pages/'+p[0]+'.png" alt="'+p[1]+'">';b.title='Color '+p[1];b.onclick=()=>openPage(p);const sheet=document.createElement('div');sheet.className='sheet';sheet.append(b);const badge=document.createElement('span');badge.className='page-number';badge.textContent=(current+1)+' / '+list.length;badge.setAttribute('aria-label','Page '+(current+1)+' of '+list.length);const heart=action('heart','Favorite '+p[1],()=>{favorites.has(p[0])?favorites.delete(p[0]):favorites.add(p[0]);render()});heart.className='icon heart page-heart'+(favorites.has(p[0])?' active':'');heart.setAttribute('aria-pressed',favorites.has(p[0]));sheet.append(badge,heart);paper.append(sheet)}
const strip=document.querySelector('.strip');strip.replaceChildren();list.forEach((p,i)=>{const b=document.createElement('button');b.className='mini'+(i===current?' current':'');b.title='Browse '+p[1];b.innerHTML='<img src="pages/'+p[0]+'.png" alt="'+p[1]+'">';b.onclick=()=>{current=i;render()};strip.append(b)});document.querySelector('.position').hidden=!grid;document.querySelector('.position').textContent=list.length?(Math.floor(current/6)*6+1)+'-'+Math.min(Math.floor(current/6)*6+6,list.length)+' / '+list.length:'0 / 0';document.querySelectorAll('.footer .utilities .icon').forEach((b,i)=>b.hidden=grid&&i>0);document.querySelector('.start').hidden=grid||!list.length;document.querySelector('.start').onclick=()=>openPage(list[current]);document.querySelector('.start').title='Color '+(list[current]?.[1]||'page');document.querySelector('.start').setAttribute('aria-label',document.querySelector('.start').title)}
document.querySelectorAll('[data-icon]').forEach(b=>b.innerHTML=icon(b.dataset.icon));document.querySelectorAll('[data-demo]').forEach(b=>b.onclick=()=>tell(b.dataset.demo));document.querySelector('.previous').onclick=()=>{current=grid?((Math.floor(current/6)+Math.ceil(visible().length/6)-1)%Math.ceil(visible().length/6))*6:(current+visible().length-1)%visible().length;render()};document.querySelector('.next').onclick=()=>{current=grid?((Math.floor(current/6)+1)%Math.ceil(visible().length/6))*6:(current+1)%visible().length;render()};document.querySelector('.view').onclick=()=>{grid=!grid;render()};document.querySelector('.filter-heart').onclick=()=>{favoriteOnly=!favoriteOnly;current=0;render()};
const descriptions={classic:'A / Focus / categories and detail above one large page; add/share below. The grid switch remembers your browsing position. All controls are visual proposals; no saves or imports occur.',rail:'B / Side tools / the same page-first browser, with add/share/custom-delete together beside the artwork. More room beneath the preview, but less artwork width on narrow screens.',strip:'C / Filmstrip / a large page with a small visual index beneath it. Jump between nearby pages without opening a grid. The extra thumbnails compete slightly with preview height.'};
function concept(name){panel.dataset.layout=name;document.querySelectorAll('[data-concept]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.concept===name));document.querySelector('#description').textContent=descriptions[name]}
document.querySelectorAll('[data-concept]').forEach(b=>b.onclick=()=>concept(b.dataset.concept));document.querySelector('#theme').onclick=()=>document.body.classList.toggle('light');document.querySelector('#sample-mix').onclick=()=>{mixed=!mixed;current=0;render()};document.querySelector('#action-position').onclick=()=>{panel.dataset.action=panel.dataset.action==='center'?'right':'center'};window.study={concept,grid:()=>{grid=!grid;render()}};concept('classic');render();
</script></html>
