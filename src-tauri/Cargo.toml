[package]
name = "studioodle-desktop"
version = "0.1.1"
description = "A playful drawing and coloring studio"
authors = ["Studioodle"]
license = "Apache-2.0"
edition = "2021"
rust-version = "1.88"

[lib]
name = "studioodle_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "Studioodle"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-window-state = "2"

[profile.release]
strip = true
